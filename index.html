<style>
:root{--o:#F26534;--b:#1870B8;--lb:#72A9BE;--ink:#E8EDF7;--mut:#A9B6D3;--dim:#7F8CAA}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#020a1f;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* Fondo: luces ambientales, resplandor del mouse y grano */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.b1{width:720px;height:720px;right:-160px;top:-200px;background:#1870B8;opacity:.5;animation:driftA 24s ease-in-out infinite alternate}
.b2{width:620px;height:620px;left:-200px;top:30%;background:#F26534;opacity:.28;animation:driftB 28s ease-in-out infinite alternate}
.b3{width:520px;height:520px;left:38%;bottom:-160px;background:#001F5B;opacity:.9;animation:driftA 32s ease-in-out infinite alternate-reverse}
@keyframes driftA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-90px,70px,0) scale(1.18)}}
@keyframes driftB{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(120px,-60px,0) scale(1.12)}}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:1;mix-blend-mode:screen;will-change:transform;opacity:0;transition:opacity .8s ease;background:radial-gradient(circle,rgba(242,101,52,.26) 0%,rgba(24,112,184,.12) 42%,rgba(2,10,31,0) 70%)}
.grain{position:fixed;left:0;top:0;width:100%;height:100%;opacity:.14;pointer-events:none;z-index:2;mix-blend-mode:overlay}

.page{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;transition:opacity .22s ease}
main.out{opacity:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}

/* Animaciones de entrada */
@keyframes rise{from{opacity:0;transform:translate3d(0,40px,0);filter:blur(12px)}to{opacity:1;transform:translate3d(0,0,0);filter:blur(0)}}
@keyframes drop{from{opacity:0;transform:translate3d(0,-24px,0);filter:blur(8px)}to{opacity:1;transform:translate3d(0,0,0);filter:blur(0)}}
@keyframes slide{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.rise{animation:rise 1.5s cubic-bezier(.16,1,.3,1) backwards}
.drop{animation:drop 1.3s cubic-bezier(.16,1,.3,1) backwards}
.reveal{opacity:0;transform:translate3d(0,36px,0);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

/* Barra de navegación */
.nav-wrap{padding:22px 24px 0}
.nav{max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 14px 14px 30px;border-radius:999px;background:rgba(8,18,48,.5);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:16px}
.sep{width:1px;height:38px;background:rgba(255,255,255,.18)}
.logo-slot{display:inline-flex;align-items:center;justify-content:center;height:56px;border:1px dashed rgba(255,255,255,.35);border-radius:8px;color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.logo-img{display:inline-flex;align-items:center;height:56px}
.logo-img img{height:100%;width:auto;display:block}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:26px;font-size:14px;font-weight:500;color:#B9C5E0}
.links a{transition:color .25s ease;padding-bottom:4px;border-bottom:2px solid transparent}
.links a:hover{color:#fff}
.links a.on{color:#fff;border-bottom-color:var(--o)}
.right{display:flex;align-items:center;gap:10px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);color:#B9C5E0;transition:border-color .3s ease,color .3s ease,background .3s ease}
.ico:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.btn1{display:inline-block;padding:13px 22px;border-radius:999px;background:var(--o);color:#020a1f;font-weight:600;font-size:14px;transition:transform .3s ease,box-shadow .3s ease}
.btn1:hover{transform:translate3d(0,-2px,0);box-shadow:0 10px 40px rgba(242,101,52,.45)}
.btn1.lg{padding:15px 28px;font-size:16px}
.btn2{display:inline-block;padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:border-color .3s ease,background .3s ease}
.btn2:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn2.sm{padding:11px 16px;font-size:13px}

/* Tipografía y secciones */
.hero{padding-top:110px}
.hero.home{padding-top:120px}
.eyebrow{margin:0 0 22px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lb)}
.h1{margin:0;max-width:960px;font-size:clamp(40px,6.6vw,92px);line-height:1;letter-spacing:-.045em;font-weight:700;color:#fff}
.h1.big{font-size:clamp(44px,7.4vw,100px);line-height:.98}
.block{display:block}
.o{color:var(--o)}
.lead{margin:28px 0 0;max-width:680px;font-size:20px;line-height:1.55;color:var(--mut)}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.sec{margin-top:64px}
.h2{margin:0 0 24px;font-size:30px;letter-spacing:-.03em;font-weight:700;color:#fff}
.label{margin:0 0 16px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.status{padding:40px 0;color:var(--mut);font-size:17px}

/* Tarjetas de vidrio con borde que se ilumina cerca del mouse */
.card{position:relative;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:28px;border-radius:20px;background:rgba(0,31,91,.35);border:1px solid rgba(114,169,190,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .5s cubic-bezier(.2,.8,.2,1),background .35s ease,border-color .35s ease;height:100%}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.85),rgba(255,255,255,0) 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:var(--p,0);pointer-events:none}
a.card:hover,.card.hov:hover{transform:translate3d(0,-6px,0);background:rgba(0,31,91,.55);border-color:rgba(255,255,255,.4)}
.num{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--lb)}
.ctitle{font-size:24px;font-weight:600;letter-spacing:-.02em;color:#fff}
.ctext{font-size:15px;line-height:1.55;color:var(--mut)}
.more-link{margin-top:8px;font-size:14px;font-weight:600;color:var(--o)}
.grid3{display:flex;flex-wrap:wrap;gap:20px}
.grid3>*{flex:1 1 300px}

/* Sponsors en movimiento */
.marq{overflow:hidden;margin:0 -24px;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:slide 60s linear infinite}
.pill{display:inline-flex;align-items:center;justify-content:center;height:60px;margin-right:14px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#D5DDF0;font-weight:600;font-size:16px;white-space:nowrap}
.pill.logo{background:#fff;border-color:#fff;padding:0 22px}
.pill.logo img{height:34px;max-width:150px;object-fit:contain;display:block}

/* E-Board */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px}
.person{display:flex;flex-direction:column;height:100%}
.photo{position:relative;aspect-ratio:4/5;border-radius:16px;background:rgba(0,31,91,.5);border:1px solid rgba(114,169,190,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pflag{position:absolute;top:10px;right:10px;display:inline-flex;padding:4px;line-height:0;border-radius:9px;background:rgba(2,10,31,.55);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.photo .pflag img{width:28px;height:19px;border-radius:3px;object-fit:cover}
.ini{font-size:44px;font-weight:700;color:rgba(114,169,190,.6)}
.role{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--o)}
.pname{margin-top:4px;font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:#fff}
.pmajor{margin-top:6px;font-size:13px;line-height:1.4;color:var(--lb)}
.bio{margin:10px 0 0;font-size:14px;line-height:1.55;color:#9FB0CE;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bio.open{display:block}
.more{align-self:flex-start;margin-top:4px;padding:6px 0;background:none;border:0;color:var(--o);font-size:13px;cursor:pointer}
.contact{display:flex;gap:16px;margin-top:8px;font-size:13px;font-weight:600}
.contact a{display:inline-block;padding:6px 0;color:#D5DDF0;transition:color .25s ease}
.contact a:hover{color:var(--o)}
.pboard{align-self:flex-start;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:#D5DDF0;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .25s ease,background .25s ease}
.chip:hover{border-color:#fff}
.chip.on{background:var(--o);border-color:var(--o);color:#020a1f;font-weight:600}

/* Sponsors */
.tier{flex-direction:row;flex-wrap:wrap;align-items:center;gap:24px;height:auto;margin-bottom:16px}
.tier-h{flex:0 0 220px}
.tier-n{display:block;font-size:12px;font-weight:600;letter-spacing:.16em}
.tier-t{display:block;margin-top:6px;font-size:28px;font-weight:700;font-style:italic;letter-spacing:-.02em;line-height:1.05;color:#fff}
.tier-b{flex:1 1 420px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.stile{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:14px 24px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#E8EDF7;font-weight:600;font-size:16px;transition:border-color .3s ease,background .3s ease}
.stile.logo{background:#fff;border-color:#fff;padding:12px 22px}
.stile.logo img{height:44px;max-width:170px;object-fit:contain;display:block}
a.stile:hover{border-color:rgba(255,255,255,.7)}
.soon{font-style:italic;font-weight:600;font-size:22px;color:var(--mut)}

/* Alumni */
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.sbox{flex:1 1 360px;max-width:520px}
.sbox label{display:block;margin-bottom:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.search{width:100%;padding:15px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:16px;transition:border-color .3s ease,background .3s ease}
.search:focus{outline:none;border-color:var(--o);background:rgba(255,255,255,.08)}
.search::placeholder{color:var(--dim)}
.count{font-size:14px;color:var(--mut)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.year{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--lb)}
.ctry{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.ctry img{width:26px;height:18px;object-fit:cover;border-radius:3px;border:1px solid rgba(255,255,255,.3);display:block}
.aname{margin-top:6px;font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:#fff}
.arole{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--o)}
.aco{font-size:15px;color:var(--mut)}
.amaj{font-size:13px;line-height:1.4;color:var(--lb)}
.alink{align-self:flex-start;display:inline-block;padding:8px 0;font-size:14px;font-weight:600;color:#D5DDF0;transition:color .25s ease}
.alink:hover{color:var(--o)}


/* Franja de nombres (Sponsors) */
.pill.nm{height:52px;font-size:17px;transition:border-color .3s ease,color .3s ease,background .3s ease}
a.pill.nm:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.1)}

/* Highlights */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:20px}
.hcard{padding:0;gap:0;overflow:hidden;height:100%}
.hph{position:relative;aspect-ratio:16/10;background:rgba(0,31,91,.55);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hph img{width:100%;height:100%;object-fit:cover;display:block}
.hbody{display:flex;flex-direction:column;gap:8px;padding:22px 24px 26px}
.htag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--o)}
.htitle{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:#fff}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--lb)}
.hco{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;background:#fff}
.hco img{height:18px;max-width:84px;object-fit:contain;display:block}
.hdesc{margin:4px 0 0;font-size:15px;line-height:1.6;color:var(--mut);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hdesc.open{display:block}
.hfeat{display:grid;grid-template-columns:1.15fr 1fr;padding:0;gap:0;overflow:hidden;height:auto;margin-bottom:64px}
.hfeat .hph{aspect-ratio:auto;min-height:320px}
.hfeat .hbody{justify-content:center;padding:36px}
.hfeat .htitle{font-size:34px;letter-spacing:-.03em}
.hfeat .hdesc{font-size:17px;-webkit-line-clamp:6}
.hsec{margin-top:56px}
.hsec .h2{margin-bottom:6px}
.hsub{margin:0 0 22px;max-width:640px;font-size:16px;line-height:1.5;color:var(--mut)}

/* Secuencia de bienvenida del Home (scroll) */
.nav-wrap{position:sticky;top:0;z-index:50;pointer-events:none}
.nav-wrap .nav{pointer-events:auto}
#seqend,#hseqend{scroll-margin-top:calc(var(--navh,100px) - 8px)}
.seq{position:relative;height:620vh;height:620svh;margin-top:calc(var(--navh,100px)*-1);margin-bottom:0}
.seq-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.bp{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(114,169,190,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(114,169,190,.11) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 46%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 46%,#000,transparent 72%)}
.beat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;opacity:0;visibility:hidden;will-change:opacity,transform}
.sym{height:clamp(120px,19vh,170px);width:auto;overflow:visible;display:block;flex:none;transform-origin:50% 50%;will-change:transform}
.sb,.sc{stroke-width:5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.sc{fill-opacity:0;fill-rule:evenodd}
.sb{fill:none}
.ivs{display:flex;align-items:center;justify-content:center;gap:clamp(28px,5vw,72px)}
.vals{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.vt{display:block;width:min(290px,70vw);height:auto;overflow:visible;margin-bottom:8px}
.vr{display:flex;align-items:center;gap:clamp(16px,2.4vw,32px)}
.vw{display:block;width:clamp(190px,19vw,270px);height:auto;overflow:visible;flex:none}
.vm{max-width:300px;text-align:left;font-size:clamp(14px,1.4vw,18px);line-height:1.35;color:var(--mut);opacity:0}
.sq-h1{position:absolute;left:0;right:0;top:calc(50% + var(--lh,230px)/2 - 20px);margin:0 auto}
.sp{stroke-width:5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;fill-rule:evenodd}
.sq-h1{max-width:920px;padding:0 24px;font-size:clamp(40px,7vw,96px);line-height:1;letter-spacing:-.045em;font-weight:700;color:#fff}
.hint{position:absolute;bottom:36px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hint i{display:block;width:1px;height:34px;background:linear-gradient(var(--o),rgba(242,101,52,0));animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate3d(0,-4px,0);opacity:.5}50%{transform:translate3d(0,6px,0);opacity:1}}
.skip{position:absolute;right:24px;bottom:30px;z-index:3;padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(2,10,31,.45);font-size:13px;font-weight:600;color:var(--mut);transition:color .25s ease,border-color .25s ease}
.skip:hover,.skip:focus-visible{color:#fff;border-color:#fff}
.sdots{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:3}
.sdots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s ease,transform .3s ease}
.sdots span.on{background:var(--o);transform:scale(1.35)}
.yr{font-size:clamp(96px,19vw,240px);font-weight:700;letter-spacing:-.06em;line-height:.9;color:#fff;font-variant-numeric:tabular-nums}
.rail{position:relative;width:min(760px,86vw);height:3px;margin:34px 0 40px;border-radius:2px;background:rgba(255,255,255,.14)}
.rail b{position:absolute;left:0;top:0;height:3px;width:0;border-radius:2px;background:var(--o)}
.rail span{position:absolute;top:14px;transform:translateX(-50%);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--dim);transition:color .3s ease}
.rail span.on{color:#fff}
.who{min-height:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wn{font-size:clamp(24px,3.4vw,38px);font-weight:600;letter-spacing:-.02em;color:#fff}
.wr{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--o)}
.cap{margin:18px 0 0;font-size:clamp(16px,1.6vw,20px);color:var(--mut)}
.mapw{display:flex;align-items:center;justify-content:center;gap:clamp(28px,6vw,90px)}
.map{height:min(66vh,560px);height:min(66svh,560px);width:auto;aspect-ratio:200/300;overflow:visible;flex:none}
.mt{text-align:left;max-width:420px;opacity:0}
.mt h2{margin:0;font-size:clamp(34px,4.6vw,60px);line-height:1.02;letter-spacing:-.04em;font-weight:700;color:#fff}
.mt p{margin:14px 0 0;font-size:clamp(18px,2vw,24px);color:var(--mut)}
.mln{fill:none;stroke:rgba(242,101,52,.65);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1}
.mpl{fill:none;stroke:#F26534;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.go .mpl{animation:sqp 1.8s ease-out infinite}

.hband .who{align-items:flex-start;min-height:68px}
.hband .cap{margin:14px 0 0}
.seq.static{height:auto;margin-top:0;margin-bottom:0;padding-top:12px}

.seq.static .beat{position:relative;inset:auto;padding:56px 24px;opacity:1!important;transform:none!important;visibility:visible!important}

<script>
(function () {
  'use strict';

  var DEFAULTS = {
    portal_url: 'https://polite-desert-068d32a10.7.azurestaticapps.net/',
    instagram_url: 'https://www.instagram.com/shpepurdue/',
    linkedin_url: 'https://www.linkedin.com/company/shpepurdue/posts/?feedView=all',
    webmaster_email: 'shpe.purdue.webmaster@gmail.com',
    sponsor_email: '',
    mission: '',
    vision: 'A place where Hispanics at Purdue are highly valued and influential.'
  };
  var ROUTES = ['home', 'about', 'eboard', 'sponsors', 'alumni', 'highlights'];
  var DEFAULT_TIERS = { 1: 'Neil Armstrong', 2: 'Amelia Earhart', 3: 'Eugene Cernan', 4: 'Silver', 5: 'Bronze' };
  var TIER_ACCENT = { 1: '#F26534', 2: '#F0705A', 3: '#72A9BE', 4: '#B9C5E0', 5: '#D9A066' };
  var BOARD_KEYS = ['president', 'vicepresident', 'treasurer', 'secretary', 'publicrelations'];
  var CANON = { president: 'President', vicepresident: 'Vice President', treasurer: 'Treasurer', secretary: 'Secretary' };

  var COUNTRIES = {
    'us': 'us', 'usa': 'us', 'united states': 'us', 'united states of america': 'us', 'estados unidos': 'us', 'eeuu': 'us',
    'panama': 'pa', 'pty': 'pa', 'mexico': 'mx', 'colombia': 'co', 'venezuela': 've', 'peru': 'pe', 'ecuador': 'ec',
    'bolivia': 'bo', 'chile': 'cl', 'argentina': 'ar', 'uruguay': 'uy', 'paraguay': 'py', 'brazil': 'br', 'brasil': 'br',
    'costa rica': 'cr', 'nicaragua': 'ni', 'honduras': 'hn', 'el salvador': 'sv', 'guatemala': 'gt', 'cuba': 'cu',
    'dominican republic': 'do', 'republica dominicana': 'do', 'puerto rico': 'pr', 'spain': 'es', 'espana': 'es',
    'canada': 'ca', 'united kingdom': 'gb', 'uk': 'gb', 'germany': 'de', 'france': 'fr', 'italy': 'it', 'china': 'cn',
    'india': 'in', 'japan': 'jp', 'netherlands': 'nl', 'switzerland': 'ch', 'ireland': 'ie', 'australia': 'au', 'singapore': 'sg'
  };

  var DATA = null;
  var FAILED = false;
  var S = { route: 'home', filter: 'all', q: '', hl: 'all' };

  // ---------- Utilidades ----------
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function key(s) { return norm(s).replace(/[^a-z]/g, '').replace(/officer$/, ''); }
  function canon(s) { return CANON[key(s)] || s; }
  function isEmail(s) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s || '').trim()); }
  function webUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[\w-]+(\.[\w-]+)+/.test(u)) return 'https://' + u;
    return '';
  }
  function initials(name) {
    return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
  }
  function cfg() {
    var c = {}, k;
    for (k in DEFAULTS) c[k] = DEFAULTS[k];
    if (DATA && DATA.config) for (k in DATA.config) if (DATA.config[k]) c[k] = DATA.config[k];
    return c;
  }
  function eventsUrl() { return cfg().portal_url.replace(/\/+$/, '') + '/events'; }

  // ---------- Configuración en enlaces ----------
  function applyConfig() {
    var c = cfg();
    $$('[data-cfg]').forEach(function (a) {
      var k = a.getAttribute('data-cfg'), v = '';
      if (k === 'events_url') v = eventsUrl();
      else if (k === 'webmaster_mail') {
        v = 'mailto:' + c.webmaster_email;
        a.textContent = c.webmaster_email;
      } else if (k === 'sponsor_mail') {
        v = 'mailto:' + (c.sponsor_email || c.webmaster_email) + '?subject=' + encodeURIComponent('SHPE Purdue sponsorship');
      } else v = c[k] || '';
      if (v) a.setAttribute('href', v);
    });
    var L = (DATA && DATA.logos) || {};
    setLogo('#logo-shpe', L.shpe, 'SHPE', 150);
    setLogo('#logo-purdue', L.purdue, 'Purdue', 110);
  }
  function setLogo(sel, url, alt, w) {
    var el = $(sel);
    if (!el || !url || el.getAttribute('data-done')) return;
    el.className = 'logo-img';
    el.style.width = '';
    el.innerHTML = '<img src="' + esc(url) + '" alt="' + esc(alt) + '">';
    el.setAttribute('data-done', '1');
  }

  // ---------- Fragmentos reutilizables ----------
  function hero(eyebrow, h1, lead, d, home) {
    d = d || [0.3, 0.5, 0.8];
    return '<section class="wrap hero' + (home ? ' home' : '') + '">' +
      '<p class="eyebrow rise" style="animation-delay:' + d[0] + 's">' + eyebrow + '</p>' +
      '<h1 class="h1 rise" style="animation-delay:' + d[1] + 's">' + h1 + '</h1>' +
      (lead ? '<p class="lead rise" style="animation-delay:' + d[2] + 's">' + lead + '</p>' : '') +
      '</section>';
  }
  function reveal(html, i) { return '<div class="reveal" style="--d:' + ((i || 0) * 0.08).toFixed(2) + 's">' + html + '</div>'; }
  function loading() { return '<p class="status">' + (FAILED ? 'We could not load this section right now. Please try again later.' : 'Loading…') + '</p>'; }

  function flagCode(pais) {
    var k = norm(pais);
    return COUNTRIES[k] || (/^[a-z]{2}$/.test(k) ? k : '');
  }
  function flagBadge(pais) {
    var code = flagCode(pais);
    if (!code) return '';
    return '<span class="pflag" title="' + esc(pais) + '"><img src="https://flagcdn.com/w40/' + code + '.png" srcset="https://flagcdn.com/w80/' + code + '.png 2x" alt="' + esc(pais) + '" data-hide-on-error="1"></span>';
  }
  function flagHtml(pais) {
    var code = flagCode(pais);
    if (!code) return esc(pais);
    return '<img src="https://flagcdn.com/w40/' + code + '.png" srcset="https://flagcdn.com/w80/' + code + '.png 2x" alt="" data-hide-on-error="1">' + esc(pais);
  }

  // ---------- Vistas ----------
  var VIEWS = {
    home: function () {
      return seqHtml() +
        '<section class="wrap" style="margin-top:56px" id="marq-sec" hidden><p class="label">Our sponsors</p><div class="marq" id="marq"></div></section>' +
        '<section class="wrap sec" style="margin-top:56px"><div class="grid3">' +
        reveal('<a class="card" href="#/eboard" data-route="eboard"><span class="num">01</span><span class="ctitle">Meet the E-Board</span><span class="ctext">The executive team and directors leading the chapter this year.</span><span class="more-link">Explore</span></a>', 0) +
        reveal('<a class="card" href="#/sponsors" data-route="sponsors"><span class="num">02</span><span class="ctitle">Our sponsors</span><span class="ctext">The companies that help our members reach their next opportunity.</span><span class="more-link">Explore</span></a>', 1) +
        reveal('<a class="card" href="#/alumni" data-route="alumni"><span class="num">03</span><span class="ctitle">Alumni network</span><span class="ctext">Past officers and where their careers have taken them.</span><span class="more-link">Explore</span></a>', 2) +
        '</div>' +
        reveal('<div class="cta-row"><a class="btn3" href="#/sponsors" data-route="sponsors">Partner with us</a></div>', 3) +
        '</section>';
    },

    about: function () {
      var p = function (n, t, x) { return '<div class="card hov"><span class="num">' + n + '</span><span class="ctitle">' + t + '</span><span class="ctext">' + x + '</span></div>'; };
      return hero('About SHPE Purdue', 'The home for Hispanics<span class="o"> in the Purdue community.</span>',
          'SHPE Purdue is the chapter of the Society of Hispanic Professional Engineers at Purdue University: a community where members grow academically, professionally and socially.') +
        '<section class="wrap sec"><div class="grid3">' +
        reveal(p('01', 'Professional development', 'Workshops, interview exercises and information sessions that connect members with opportunities.'), 0) +
        reveal(p('02', 'Mentorship', 'Guidance from officers and alumni for members at every stage of their time at Purdue.'), 1) +
        reveal(p('03', 'Community', 'A familia of students who support each other academically, professionally and socially.'), 2) +
        '</div></section>' +
        '<section class="wrap" style="margin-top:20px"><div class="grid3" id="mv"></div></section>' +
        '<section class="wrap sec">' + reveal(
          '<div class="cta"><div style="flex:1 1 420px"><h2>Be part of the familia.</h2><p>Members sign in to the portal to see events, check in and track their points.</p></div>' +
          '<div class="actions" style="margin:0"><a class="btn1 lg" href="#" data-cfg="portal_url" target="_blank" rel="noopener">Member Portal</a><a class="btn2" href="#/sponsors" data-route="sponsors">Partner with us</a></div></div>') + '</section>';
    },

    eboard: function () {
      return hero('Meet the team', 'Our <span class="o">E-Board.</span>', 'The executive team and the Board of Directors leading SHPE Purdue.') +
        '<section class="wrap sec"><h2 class="h2 reveal">Executive Team</h2><div id="exec" class="pgrid">' + loading() + '</div></section>' +
        '<section class="wrap sec" id="dir" style="margin-top:72px"><h2 class="h2 reveal">Board of Directors</h2><div id="chips" class="chips"></div><div id="dirgrid" class="pgrid"></div></section>';
    },

    sponsors: function () {
      return hero('Our sponsors', 'Companies that invest<span class="o"> in our members.</span>',
          'Collaborative events such as workshops, interview exercises and information sessions connect our members with the opportunities that follow.') +
        '<section class="wrap" style="margin-top:44px" id="nbelt-sec" hidden><div class="marq rise" style="animation-delay:1.1s" id="nbelt"></div></section>' +
        '<section class="wrap sec"><div id="tiers">' + loading() + '</div></section>' +
        '<section class="wrap sec">' + reveal(
          '<div class="cta"><div style="flex:1 1 420px"><h2>Partner with SHPE Purdue.</h2><p>Build a positive corporate presence with our talented and diverse members.</p></div>' +
          '<a class="btn1 lg" href="#" data-cfg="sponsor_mail" target="_top">Get in touch</a></div>') + '</section>';
    },

    highlights: function () {
      return hero('Highlights', 'What we do<span class="o"> as a chapter.</span>',
          'A look at the events that bring our members together: company events, community, service and coffee breaks.') +
        '<section class="wrap sec" style="margin-top:48px"><div id="hlchips" class="chips"></div><div id="hlfeat"></div><div id="hlsecs">' + loading() + '</div></section>';
    },

    alumni: function () {
      return histSeqHtml() +
        '<section class="wrap sec" style="margin-top:40px"><div class="tools"><div class="sbox"><label for="q">Search alumni</label>' +
        '<input id="q" class="search" type="text" autocomplete="off" placeholder="Name, major, company, country or role" value="' + esc(S.q) + '"></div><span class="count" id="count"></span></div>' +
        '<div id="agrid" class="agrid">' + loading() + '</div></section>';
    }
  };

  // ---------- Relleno con datos ----------
  function personHtml(p, boardKey) {
    var photo = p.foto
      ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.nombre) + '" loading="lazy" data-fallback="' + esc(initials(p.nombre)) + '">'
      : '<span class="ini">' + esc(initials(p.nombre)) + '</span>';
    var bio = '';
    if (p.bio) {
      bio = '<p class="bio">' + esc(p.bio) + '</p>' + (p.bio.length > 160 ? '<button class="more" type="button" data-more="1">Read more</button>' : '');
    }
    var links = '';
    if (isEmail(p.correo)) links += '<a href="mailto:' + esc(p.correo) + '" target="_top">Email</a>';
    if (webUrl(p.linkedin)) links += '<a href="' + esc(webUrl(p.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>';
    var btn = boardKey ? '<button class="btn2 sm pboard" type="button" data-open-board="' + boardKey + '">' + esc(boardName(p.cargo)) + '</button>' : '';
    var sub = (!boardKey && p.board && !isExec(p)) ? '<span class="role" style="margin-top:6px;color:#7F8CAA;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px">' + esc(boardsOf(p).map(function (b) { return boardName(b.raw); }).join(' · ')) + '</span>' : '';
    return '<div class="person"><div class="photo">' + photo + flagBadge(p.pais) + '</div><span class="role">' + esc(canon(p.cargo)) + '</span><span class="pname">' + esc(p.nombre) + '</span>' + (p.major ? '<span class="pmajor">' + esc(p.major) + '</span>' : '') + sub + bio + (links ? '<div class="contact">' + links + '</div>' : '') + btn + '</div>';
  }
  function isExec(p) { return norm(p.grupo) === 'executive'; }

  // Una persona puede pertenecer a más de un board: "Treasurer, Secretary" (separados por coma, & o "and")
  function boardsOf(p) {
    return String(p.board || '').split(/\s*(?:,|&|\/|\band\b)\s*/i)
      .map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (raw) { return { key: key(raw), raw: raw }; });
  }
  function boardName(raw) {
    var n = canon(raw).replace(/\s+officer$/i, '');
    return /s$/i.test(n) ? n + ' Board' : n + '\'s Board';
  }
  function boardKeysOf(dirs) {
    var seen = {}, out = [], all = [];
    dirs.forEach(function (d) { boardsOf(d).forEach(function (b) { all.push(b.key); }); });
    BOARD_KEYS.forEach(function (k) { if (all.indexOf(k) >= 0) { seen[k] = 1; out.push(k); } });
    all.forEach(function (k) { if (k && !seen[k]) { seen[k] = 1; out.push(k); } });
    return out;
  }
  function boardLabel(k, dirs) {
    var raw = k;
    dirs.some(function (d) {
      return boardsOf(d).some(function (b) { if (b.key === k) { raw = b.raw; return true; } return false; });
    });
    return boardName(raw);
  }

  function fillEboard() {
    var exec = $('#exec');
    if (!exec) return;
    if (!DATA) { if (FAILED) exec.innerHTML = loading(); return; }
    var all = DATA.eboard || [];
    var execs = all.filter(isExec), dirs = all.filter(function (p) { return !isExec(p); });
    var boards = boardKeysOf(dirs);
    exec.innerHTML = execs.length ? execs.map(function (p, i) {
      return reveal(personHtml(p, boards.indexOf(key(p.cargo)) >= 0 ? key(p.cargo) : ''), i);
    }).join('') : '<p class="status">No officers yet.</p>';
    fillDirectors();
    afterFill();

    var end = sqEnd(), yr = Math.round(SQ_START + (end - SQ_START) * f);
    HS.bar.style.width = (f * 100).toFixed(1) + '%';
    if (yr !== HS.lastY) {
      HS.lastY = yr; HS.yr.textContent = yr; hsWho(yr);
      HS.ticks.forEach(function (t) { t.classList.toggle('on', yr >= +t.getAttribute('data-y')); });
    }
  }
  function hsTick(t) {
    if (!HS) return;
    var f = ease(clamp((t - HS.t0) / 6500, 0, 1));
    hsPaint(f);
    if (f < 1) HS.raf = requestAnimationFrame(hsTick);
  }
  function teardownHist() {
    if (!HS) return;
    if (HS.raf) cancelAnimationFrame(HS.raf);
    HS = null;
  }
  function initHist() {
    teardownHist();
    var el = $('#hseq');
    if (!el) return;
    HS = { el: el, yr: $('#hs-yr'), bar: $('#hs-bar'), who: $('#hs-who'), ticks: $$('.rail span', el), lastY: 0, f: 0, raf: 0 };
    if (calm) { hsPaint(1); return; }
    HS.t0 = performance.now() + 900;
    HS.raf = requestAnimationFrame(hsTick);
  }

  // ---------- Navegación ----------
  function setActive() {
    $$('.links a[data-route]').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-route') === S.route); });
  }
  function draw(animate) {
    var v = $('#view');
    var run = function () {
      teardownSeq(); teardownHist();
      v.innerHTML = VIEWS[S.route]();
      v.classList.remove('out');
      window.scrollTo(0, 0);
      setActive();
      afterFill();
      hydrate();
      if (S.route === 'home') initSeq();
      if (S.route === 'alumni') initHist();
    };
    if (animate) { v.classList.add('out'); setTimeout(run, 220); } else run();
  }
  function go(route, animate) {
    if (ROUTES.indexOf(route) < 0) route = 'home';
    if (route === S.route && animate) { window.scrollTo(0, 0); return; }
    S.route = route;
    try { if (location.hash !== '#/' + route) location.hash = '/' + route; } catch (e) { /* iframe sin acceso */ }
    draw(animate);
  }
  function fromHash() {
    var m = String(location.hash || '').match(/^#\/(\w+)/);
    return m ? m[1] : '';
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    var sk = t.closest && t.closest('[data-skip]');
    if (sk) { e.preventDefault(); var se = $('#seqend'); if (se) se.scrollIntoView({ behavior: calm ? 'auto' : 'smooth' }); return; }
    var r = t.closest && t.closest('[data-route]');
    if (r) { e.preventDefault(); go(r.getAttribute('data-route'), true); return; }
    var hl = t.closest && t.closest('[data-hl]');
    if (hl) { S.hl = hl.getAttribute('data-hl'); fillHighlights(); return; }
    var f = t.closest && t.closest('[data-filter]');
    if (f) { S.filter = f.getAttribute('data-filter'); fillDirectors(); return; }
    var ob = t.closest && t.closest('[data-open-board]');
    if (ob) {
      S.filter = ob.getAttribute('data-open-board'); fillDirectors();
      var d = $('#dir'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var m = t.closest && t.closest('[data-more]');
    if (m) { var b = m.previousElementSibling; if (b) { var open = b.classList.toggle('open'); m.textContent = open ? 'Show less' : 'Read more'; } }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') { S.q = e.target.value; fillAlumni(); }
  });
  window.addEventListener('hashchange', function () {
    var h = fromHash();
    if (h && h !== S.route && ROUTES.indexOf(h) >= 0) { S.route = h; draw(true); }
  });

  // ---------- Arranque ----------
  S.route = ROUTES.indexOf(INITIAL) >= 0 ? INITIAL : (ROUTES.indexOf(fromHash()) >= 0 ? fromHash() : 'home');
  draw(false);

  // Carga de datos: muestra al instante la última copia guardada y la actualiza en segundo plano
  var CACHE_KEY = 'shpe_site_data_v2';
  var cachedStr = '';
  try {
    cachedStr = localStorage.getItem(CACHE_KEY) || '';
    if (cachedStr) { DATA = JSON.parse(cachedStr); hydrate(); }
  } catch (e) { cachedStr = ''; DATA = null; }

  if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
    if (!DATA) { FAILED = true; hydrate(); }
  } else {
    fetch(API_URL)
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (d) {
        if (!d || d.error) throw new Error('api');
        var fresh = JSON.stringify(d);
        try { localStorage.setItem(CACHE_KEY, fresh); } catch (e) { /* sin almacenamiento */ }
        if (fresh !== cachedStr) { DATA = d; hydrate(); }
      })
      .catch(function () { if (!DATA) { FAILED = true; hydrate(); } });
  }
})();
</script>
</body>
</html>
